<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>生日快乐 love love！——给最爱的你</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #f9e1e8, #fff0f5, #ffebee);
      color: #333;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 20px 0;
    }

    .container {
      text-align: center;
      padding: 20px 15px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
      animation: fadeIn 2s ease-in;
    }

    h1 {
      font-size: 4.5rem;
      color: #f32a2d;
      margin: 20px 0 0;
      text-shadow: 0 0 20px rgba(199, 0, 20, 0.627);
      animation: heartbeat 2s infinite;
    }

    .subtitle {
      font-size: 2rem;
      color: #ff858d;
      margin: 10px 0 40px;
    }

    .photo {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      object-fit: cover;
      border: 8px solid white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin: 30px auto;
    }

    .blessing {
      font-size: 1.5rem;
      line-height: 2;
      max-width: 700px;
      margin: 0 auto 50px;
      color: #444;
      background: rgba(255,255,255,0.7);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .heart {
      color: #ff4757;
      font-size: 1.8rem;
    }

    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      50%     { transform: scale(1.08); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hearts {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: -1;
    }

    /* 蛋糕部分保持你的风格 */
    .birthday-cake {
      position: relative;
      width: 300px;
      height: 280px;
      margin: 60px auto;
    }

    .plate {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      height: 18px;
      background: linear-gradient(#fafafa, #eee);
      border-radius: 50%;
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
    }

    .cake-body {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
      height: 180px;
      transition: all 0.6s;
    }

    .layer-1, .layer-2, .layer-3 {
      width: 100%;
      height: 33.33%;
      border-radius: 18px 18px 0 0;
      background: linear-gradient(#fff0f5, #ffecec);
      box-shadow: inset 0 -6px 10px rgba(0,0,0,0.04);
    }

    .layer-2 { transform: translateY(6%); background: linear-gradient(#fff4f8, #ffefef); }
    .layer-3 { transform: translateY(12%); background: linear-gradient(#fff8fb, #fff2f2); }

    .icing {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      background: linear-gradient(#fff, #ffe6ef);
      border-radius: 18px 18px 0 0;
      box-shadow: 0 4px 10px rgba(255,150,170,0.06);
    }

    .cherries {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
    }

    .cherry {
      width: 18px;
      height: 18px;
      background: radial-gradient(circle at 35% 30%, #ff6b6b, #c70039);
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    /* 蜡烛部分 - 核心修复在这里 */
    /* 蜡烛容器 */
.candles {
  position: absolute;
  top: -60px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 35px;
}

.candle {
  width: 12px;
  height: 60px;
  background: linear-gradient(to bottom, #fffdd0, #ffeb99, #ffd966);
  border-radius: 6px 6px 3px 3px;
  position: relative;
  cursor: pointer;
  box-shadow: 0 4px 8px rgba(0,0,0,0.15);
}

.candle::before {
  content: "";
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 2.5px;
  height: 14px;
  background: #111;
  border-radius: 50% 50% 30% 30%;
  z-index: 3;
  transition: all 0.6s ease-out;
}

.flame {
  position: absolute;
  top: -42px;
  left: 50%;
  transform: translateX(-50%);
  width: 32px;
  height: 70px;
  background: radial-gradient(ellipse at 50% 20%, 
    #ffffff 0%, #ffff99 15%, #ffcc33 35%, #ff9900 60%, #ff3300 85%, transparent 100%);
  border-radius: 50% 50% 50% 50% / 70% 70% 40% 40%;
  box-shadow: 0 -10px 30px #ffcc33, 0 0 50px #ff6600;
  filter: blur(4px);
  animation: flame-flicker 1.4s infinite alternate;
  pointer-events: auto;
  transition: all 0.9s ease-out;
  z-index: 2;
}

@keyframes flame-flicker {
  0%   { transform: translateX(-50%) scale(1) rotate(-3deg); opacity: 0.95; }
  50%  { transform: translateX(-50%) scale(1.12) rotate(3deg); opacity: 1; }
  100% { transform: translateX(-50%) scale(1.05) rotate(-2deg); opacity: 0.92; }
}

/* 吹灭关键样式 - 确保选择器正确 */
.candle[data-state="extinguished"] .flame {
  opacity: 0 !important;
  transform: translateX(-50%) scale(0.1) translateY(20px) !important;
  animation: none !important;  /* 停止闪烁 */
}

.candle[data-state="extinguished"]::before {
  background: #0a0a0a;
  height: 18px;
  top: -12px;
  border-radius: 40% 40% 60% 60%;
  box-shadow: 0 3px 8px rgba(0,0,0,0.7);
}

.candle[data-state="extinguished"]::after {
  content: "";
  position: absolute;
  top: -60px;
  left: 50%;
  width: 20px;
  height: 20px;
  background: rgba(200, 200, 200, 0.6);
  border-radius: 50%;
  transform: translateX(-50%);
  animation: smoke-rise 2.5s forwards;
  pointer-events: none;
}

@keyframes smoke-rise {
  0%   { opacity: 0.6; transform: translateX(-50%) translateY(0) scale(0.8); }
  100% { opacity: 0;   transform: translateX(-50%) translateY(-120px) scale(2); }
}
    /* 灭掉状态 */
    .candle[data-state="extinguished"] .flame {
      opacity: 0;
      transform: translateX(-50%) scale(0.15) translateY(15px); /* 缩小 + 下沉，像吹灭 */
    }

    .candle[data-state="extinguished"]::before {
      background: #0a0a0a;        /* 更深的焦黑 */
      height: 18px;               /* 烧剩的芯稍长 */
      top: -12px;
      border-radius: 40% 40% 60% 60%; /* 顶部焦变形 */
      box-shadow: 0 3px 8px rgba(0,0,0,0.7);
    }

    /* 烟效果保持 */
    .candle[data-state="extinguished"]::after {
      content: "";
      position: absolute;
      top: -60px;
      left: 50%;
      width: 20px;
      height: 20px;
      background: rgba(200, 200, 200, 0.6);
      border-radius: 50%;
      transform: translateX(-50%);
      animation: smoke-rise 2.5s forwards;
      pointer-events: none;
    }

    @keyframes smoke-rise {
      0%   { opacity: 0.6; transform: translateX(-50%) translateY(0) scale(0.8); }
      100% { opacity: 0;   transform: translateX(-50%) translateY(-120px) scale(2); }
    }

    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 100% { transform: translateY(-20px); opacity: 1; } }
    @keyframes shake { 0% { transform: translateX(-50%) rotate(0deg); } 25% { transform: translateX(-50%) rotate(4deg); } 50% { transform: translateX(-50%) rotate(0deg); } 75% { transform: translateX(-50%) rotate(-4deg); } 100% { transform: translateX(-50%) rotate(0deg); } }
  </style>
</head>
<body>

  <div class="hearts"></div>

  <div class="container">
    <h1>生日快乐！</h1>
    <div class="subtitle">这一年辛苦你了！老己！</div>

    <img src="img-176896091101441b0329d4b47e1b2514a9ac289c42dc04b7ab20fd3951529c48d80dbf091d8b8.jpg" alt="我们的照片" class="photo">

    <div class="blessing">
      <p>always happy, always grateful</p>
      <p>我想对你说一千句、一万句“生日快乐”，</p>
      <p>但最后只想认真地说一句：</p>
      <p style="font-size: 2rem; margin: 30px 0; color:#e91e63; font-weight:bold;">
        永远不后悔相遇，永远抬头寻找新的阳光💌💟
      </p>
      <p>the universe loves u always</p>
      <p class="heart">♡♡♡ always for us  ♡♡♡</p>
    </div>

    <div class="birthday-cake">
      <div class="plate"></div>
      <div class="cake-body" id="cakeBody">
        <div class="layer-1"></div>
        <div class="layer-2"></div>
        <div class="layer-3"></div>
        <div class="icing"></div>
        <div class="cherries">
          <div class="cherry"></div>
          <div class="cherry"></div>
          <div class="cherry"></div>
        </div>
      </div>
     <div class="candles" id="candlesContainer">
  <div class="candle" data-state="lit">
    <div class="flame"></div>
  </div>
  <div class="candle" data-state="lit">
    <div class="flame"></div>
  </div>
  <div class="candle" data-state="lit">
    <div class="flame"></div>
  </div>
  <div class="candle" data-state="lit">
    <div class="flame"></div>
  </div>
</div>
    </div>
  </div>

  <audio id="birthdaySong" src="Various Artists - Happy Birthday To You.mp3"></audio>

  <script>
    // 飘落爱心
    function createHeart() {
      const heart = document.createElement("div");
      heart.innerText = "💖";
      heart.style.position = "absolute";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 30 + 20 + "px";
      heart.style.animation = `fall ${Math.random() * 5 + 5}s linear`;
      document.querySelector(".hearts").appendChild(heart);
      setTimeout(() => heart.remove(), 10000);
    }
    setInterval(createHeart, 300);

    const fallStyle = document.createElement("style");
    fallStyle.innerHTML = `@keyframes fall { to { transform: translateY(100vh) rotate(360deg); opacity: 0; } }`;
    document.head.appendChild(fallStyle);

    // 蜡烛交互
    const candles = document.querySelectorAll('.candle');
    const song = document.getElementById('birthdaySong');
    let extinguishedCount = 0;

    candles.forEach(candle => {
      candle.addEventListener('click', () => {
        if (candle.dataset.state === 'extinguished') {
          candle.dataset.state = 'lit';
          extinguishedCount = Math.max(0, extinguishedCount - 1);
        } else {
          candle.dataset.state = 'extinguished';
          extinguishedCount++;

          if (extinguishedCount === candles.length) {
            song.currentTime = 0;
            song.play().catch(e => console.log("音乐需交互先点页面哦～"));

            setTimeout(() => {
              showBigWish();
              document.getElementById('cakeBody').style.animation = 'shake 0.8s ease-in-out 3';
            }, 800);

            setTimeout(resetCandles, 1200000);  // 你的20分钟，保持
          }
        }
      });
    });

    function resetCandles() {
      candles.forEach(candle => {
        candle.dataset.state = 'lit';
      });
      extinguishedCount = 0;
      song.pause();
    }

    function showBigWish() {
      const wish = document.createElement('div');
      wish.textContent = '生日快乐！欢迎到来！属于我的22岁！♡';
      wish.style.position = 'fixed';
      wish.style.top = '50%';
      wish.style.left = '50%';
      wish.style.transform = 'translate(-50%, -50%)';
      wish.style.fontSize = '4.5rem';
      wish.style.color = '#ff3366';
      wish.style.fontWeight = 'bold';
      wish.style.textShadow = '0 0 30px rgba(255,51,102,0.8)';
      wish.style.zIndex = '9999';
      wish.style.opacity = '0';
      wish.style.transition = 'all 1.5s ease';
      wish.style.pointerEvents = 'none';
      document.body.appendChild(wish);

      setTimeout(() => {
        wish.style.opacity = '1';
        wish.style.transform = 'translate(-50%, -50%) scale(1.15)';
      }, 100);

      setTimeout(() => {
        wish.style.opacity = '0';
        wish.style.transform = 'translate(-50%, -50%) scale(0.9)';
        setTimeout(() => wish.remove(), 1500);
      }, 4000);
    }
  </script>
</body>
</html>
